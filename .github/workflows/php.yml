name: CI

on:
  push:
    branches: [ '[1-9].[0-9]+' ]
  pull_request:
    branches: [ '[1-9].[0-9]+' ]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-versions: ['8.4', '8.5']
    name: PHP ${{ matrix.php-versions }}

    steps:
    - uses: actions/checkout@v2
    
    - name: Set Timezone
      uses: szenius/set-timezone@v1.0
      with:
        timezoneLinux: "Europe/Paris"
    
    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: json, intl
        ini-values: date.timezone=Europe/Paris
    - name: Check PHP Version
      run: php -v

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # Add a test script to composer.json, for instance: "test": "vendor/bin/phpunit"
    # Docs: https://getcomposer.org/doc/articles/scripts.md

    - name: Run test suite
      run: composer run-script tests

  sf-compatibility:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        sf-versions: ['6.4', '7.4', '8.0']
    name: Symfony ${{ matrix.sf-versions }}

    steps:
    - uses: actions/checkout@v2

    - name: Set Timezone
      uses: szenius/set-timezone@v1.0
      with:
        timezoneLinux: "Europe/Paris"

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: json, intl
        ini-values: date.timezone=Europe/Paris
    - name: Check PHP Version
      run: php -v

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    # psalm 6 is not compatible with Symfony 6.4, so remove it
    - name: Remove psalm
      run: composer remove --dev vimeo/psalm

    - name: Set Symfony version
      run: composer require --dev "symfony/symfony:~${{ matrix.sf-versions }}.0"

    - name: Run test suite
      run: composer run-script tests

  analysis:
    name: Analysis
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set Timezone
      uses: szenius/set-timezone@v1.0
      with:
        timezoneLinux: "Europe/Paris"

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: json
        ini-values: date.timezone=Europe/Paris, opcache.jit=disable

    - name: Install Infection
      run: |
        wget https://github.com/infection/infection/releases/download/0.32.6/infection.phar
        wget https://github.com/infection/infection/releases/download/0.32.6/infection.phar.asc
        chmod +x infection.phar
        gpg --recv-keys C6D76C329EBADE2FB9C458CFC5095986493B4AA0
        gpg --with-fingerprint --verify infection.phar.asc infection.phar

    - name: Validate composer.json and composer.lock
      run: composer validate --strict

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run type coverage
      run: composer run-script psalm

    # TODO: min-msi has been decrease to 80 to allow compatibility between SF 4.3 to 7.4. We should increase it to 90 on bdf-form 2.0
    - name: Run Infection
      run: |
        git fetch --depth=1 origin $GITHUB_BASE_REF
        ./infection.phar --logger-github --git-diff-base=origin/$GITHUB_BASE_REF --git-diff-filter=AM --min-msi=80

  coverage:
    name: Test coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2

    - name: Set Timezone
      uses: szenius/set-timezone@v1.0
      with:
        timezoneLinux: "Europe/Paris"

    - name: Install PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        extensions: json
        ini-values: date.timezone=Europe/Paris

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run test coverage
      run: ./vendor/bin/phpunit --coverage-clover=coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: coverage.xml
